version: '3.8'

services:
  task-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    command: python -m uvicorn app.adapters.http.fastapi_app:app --host 0.0.0.0 --port 8000 --reload
